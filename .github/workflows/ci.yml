name: CI

# Runs on every PR, whatever the base branch: new advisories are published against
# dependencies that are already in the lockfile
on:
  pull_request:

permissions:
  contents: read

jobs:
  # advisories of the production dependencies, ignored ones are in the `audit` script of package.json
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - run: bun run audit
        shell: bash

  # advisories of every dependency of both lockfiles, dev ones included, ignored ones are in osv-scanner.toml
  osv_scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            -L
            bun.lock
            -L
            pnpm-lock.yaml
