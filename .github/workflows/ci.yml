name: CI

# Runs on every PR, whatever the base branch: new advisories are published against
# dependencies that are already in the lockfile
on:
  pull_request:

permissions:
  contents: read

jobs:
  # advisories of the production dependencies in bun.lock, ignored ones are in the `audit` script
  # of package.json
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - run: bun run audit
        shell: bash

  # same for pnpm-lock.yaml, ignored ones are in pnpm-workspace.yaml
  audit_pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.1
      - run: pnpm audit --prod
        shell: bash
